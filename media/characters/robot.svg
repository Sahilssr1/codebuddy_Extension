<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Body -->
  <rect x="50" y="60" width="100" height="90" rx="20" fill="#4A90E2" stroke="#2C3E50" stroke-width="4"/>
  
  <!-- Screen/Face -->
  <rect x="65" y="75" width="70" height="50" rx="10" fill="#E8F4F8" stroke="#2C3E50" stroke-width="3"/>
  
  <!-- Eyes -->
  <circle cx="85" cy="100" r="6" fill="#2C3E50">
    <animate attributeName="r" values="6;6;1;6;6" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="115" cy="100" r="6" fill="#2C3E50">
    <animate attributeName="r" values="6;6;1;6;6" dur="4s" repeatCount="indefinite" />
  </circle>
  
  <!-- Mouth / Smile -->
  <path d="M 90 112 Q 100 120 110 112" fill="transparent" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>

  <!-- Antenna -->
  <line x1="100" y1="60" x2="100" y2="30" stroke="#2C3E50" stroke-width="4"/>
  <circle cx="100" cy="25" r="8" fill="#F39C12" stroke="#2C3E50" stroke-width="3">
    <animate attributeName="fill" values="#F39C12;#F1C40F;#F39C12" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Arms -->
  <path d="M 50 90 Q 30 110 40 130" fill="transparent" stroke="#4A90E2" stroke-width="12" stroke-linecap="round"/>
  <path d="M 50 90 Q 30 110 40 130" fill="transparent" stroke="#2C3E50" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" style="mix-blend-mode: overlay; opacity: 0.3"/>

  <path d="M 150 90 Q 170 110 160 130" fill="transparent" stroke="#4A90E2" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Wheels/Base -->
  <circle cx="70" cy="160" r="15" fill="#34495E" stroke="#2C3E50" stroke-width="3"/>
  <circle cx="130" cy="160" r="15" fill="#34495E" stroke="#2C3E50" stroke-width="3"/>
</svg>
